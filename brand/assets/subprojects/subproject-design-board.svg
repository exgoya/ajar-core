<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc"><title id="title">AJAR 서브 프로젝트 디자인 구조</title><desc id="desc">제품 이름과 작은 출처 표기를 기본으로, 내부 도구의 가족형 조합과 이름 미확정 상태를 비교하고 기능 화면의 정보 위계를 설명한다. 실제 제품 화면이 아닌 구조 예시다.</desc><rect width="1440" height="1160" fill="#F2F0E8"/><style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#26392D}.small{font-size:16px;fill:#596457}.label{font-size:13px;letter-spacing:1.5px}.name{font-size:48px;font-weight:300}</style><text x="64" y="60" font-size="13" class="label">AJAR / SUB PROJECT DESIGN</text><text x="64" y="123" font-size="38" class="">제품의 이름을 먼저. AJAR는 작은 출처로.</text><text x="64" y="163" font-size="16" class="small">적용 제안 v1.0 · 이름과 구성 비교용 보드 · 공식 제품 로고 / 실제 구현 화면 아님</text><rect x="64" y="205" width="416" height="300" rx="12" fill="#FFFFFF" stroke="none"/><rect x="512" y="205" width="416" height="300" rx="12" fill="#FFFFFF" stroke="none"/><rect x="960" y="205" width="416" height="300" rx="12" fill="#FFFFFF" stroke="none"/><text x="88" y="241" font-size="13" class="label">01 / DEFAULT</text><text x="88" y="331" font-size="48" class="name">Project</text><text x="91" y="369" font-size="16" class="small">by AJAR</text><text x="88" y="449" font-size="19" class="">독립 제품: 이름 + 작은 출처</text><text x="88" y="478" font-size="16" class="small">고유 심볼은 필요해질 때 별도 제작</text><text x="536" y="241" font-size="13" class="label">02 / FAMILY</text><g transform="translate(529 263) scale(0.8)"><path d="M106.1127 48.8873 A44 44 0 1 0 119 80 L119 116" fill="none" stroke="#26392D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g><text x="649" y="331" font-size="43" class="name">Project</text><text x="536" y="449" font-size="19" class="">AJAR 내부 기능: C1 + 제품 이름</text><text x="536" y="478" font-size="16" class="small">심볼과 글자는 독립 요소로 배치</text><text x="984" y="241" font-size="13" class="label">03 / WORKING NAME</text><text x="984" y="331" font-size="42" class="name">ajar project</text><text x="984" y="369" font-size="16" class="small">이름 미확정 단계의 텍스트 예시</text><text x="984" y="449" font-size="19" class="">네 글자 ajar도 모두 일반 서체</text><text x="984" y="478" font-size="16" class="small">첫 a를 C1으로 바꾸지 않기</text><text x="64" y="563" font-size="13" class="label">04 / PRODUCT UI HIERARCHY</text><rect x="64" y="592" width="864" height="490" rx="12" fill="#FFFFFF" stroke="none"/><text x="96" y="637" font-size="24" class="">Project</text><text x="804" y="637" font-size="16" class="">설정</text><path d="M96 660H896" stroke="#D3D8CD"/><text x="96" y="712" font-size="30" class="">내 작업</text><text x="96" y="747" font-size="16" class="small">최근 작업을 이어가거나 새로 시작하세요.</text><rect x="722" y="683" width="174" height="48" rx="8" fill="#26392D" stroke="none"/><text x="752" y="714" font-size="16" fill="#F2F0E8" style="fill:#F2F0E8">새 항목 만들기</text><rect x="96" y="777" width="76" height="36" rx="8" fill="#DBEA5C" stroke="none"/><text x="114" y="801" font-size="16" class="">전체</text><text x="194" y="801" font-size="16" class="">진행 중</text><text x="282" y="801" font-size="16" class="">보관</text><path d="M96 839H896" stroke="#D3D8CD"/><text x="96" y="876" font-size="18" class="">항목 제목</text><text x="96" y="905" font-size="14" class="small">초안 · 마지막 저장 시각</text><text x="828" y="887" font-size="16" class="">열기</text><path d="M96 927H896" stroke="#D3D8CD"/><text x="96" y="966" font-size="18" class="">다른 항목 제목</text><text x="96" y="995" font-size="14" class="small">완료 · 수정 가능</text><text x="828" y="977" font-size="16" class="">열기</text><text x="96" y="1050" font-size="12" class="small">by AJAR</text><text x="700" y="1050" font-size="12" class="small">설명용 화면 · 실제 데이터 아님</text><text x="976" y="628" font-size="24" class="">가벼운 정체성, 분명한 작업</text><text x="976" y="681" font-size="18" class="">1  제품 이름은 작고 차분하게</text><text x="976" y="727" font-size="18" class="">2  화면 제목은 읽기 쉽게</text><text x="976" y="773" font-size="18" class="">3  주요 행동은 하나로 강조</text><text x="976" y="819" font-size="18" class="">4  라임은 선택 상태에 제한</text><text x="976" y="865" font-size="18" class="">5  상태는 색 + 문구로 표시</text><text x="976" y="911" font-size="18" class="">6  기록을 이어갈 길을 남기기</text><text x="976" y="979" font-size="16" class="small">본문 16px / 400</text><text x="976" y="1007" font-size="16" class="small">주요 조작 영역 44px 이상</text><text x="976" y="1035" font-size="16" class="small">로고의 얇음을 UI 전체에 강요하지 않기</text><text x="64" y="1127" font-size="16" class="small">AJAR — 언제든 열려 있는</text><text x="1075" y="1127" font-size="13" class="label">2026-10-29 / PROPOSAL</text></svg>