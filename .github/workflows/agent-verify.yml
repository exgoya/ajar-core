name: Agent verification
on:
  pull_request:
    paths: ['agent-mvp/**', '.github/workflows/agent-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify in isolated container without network or secrets
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 --user 65534:65534 --tmpfs /tmp:rw,noexec,nosuid,size=16m -v "$PWD/agent-mvp:/work:ro" -v "$PWD/docs:/docs:ro" -w /work python:3.12-slim python -B -m unittest discover -s tests -v
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 --user 65534:65534 --tmpfs /tmp:rw,noexec,nosuid,size=16m -v "$PWD/agent-mvp:/work:ro" -v "$PWD/docs:/docs:ro" -w /work python:3.12-slim python -B verify_app.py
