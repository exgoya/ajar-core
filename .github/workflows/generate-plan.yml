name: Generate plan
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Idea Issue number (sent to OpenAI)
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: ajar-plan-${{ inputs.issue }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.actor == 'exgoya' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/ajar.py generate --issue "$IDEA_ISSUE"
        env:
          IDEA_ISSUE: ${{ inputs.issue }}
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
